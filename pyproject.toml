[project]
name = "motion-capture-camera-art-recorder"
version = "0.1.0"
description = "Enregistreur C++ de flux DTrack (ART) avec visualisation Python"
authors = [
    { name = "tintin75011", email = "martin.chassard@ls2n.fr" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2,<4.0.0",
    "numpy>=2.5.4,<3.0.0",
    "pandas>=3.1.1,<4.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"